name: Torn Trade Analyzer v0.1.11 player trades

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.event.issue.title == 'publish-tta-v0111-player-trades'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta_v0111_patch.py
      - name: Verify syntax and trade allocation
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          node .github/scripts/tta_v0111_trade_test.js
          grep -q '@version      0.1.11' torn-trade-analyzer.user.js
          grep -q "apiGet('/user/trades'" torn-trade-analyzer.user.js
          grep -q 'parsePlayerTrade' torn-trade-analyzer.user.js
          grep -q 'market-value + equal cash delta' torn-trade-analyzer.user.js
          grep -q "source:'Player Trade'" torn-trade-analyzer.user.js
          grep -q "if(/\\\\btrade\\\\b/i.test(title))return\[\];" torn-trade-analyzer.user.js
          printf 'PASS: v0.1.11 syntax + authoritative player trades + equal-by-item-type cash allocation + duplicate trade-log suppression\n' > .tta-v0111-status.txt
      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v0111-status.txt
          git commit -m 'Torn Trade Analyzer v0.1.11 player trades'
          git push origin HEAD:main
