name: Torn Trade Analyzer v0.1.8 performance UX

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.event.issue.title == 'publish-tta-v018-performance-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply optimization patch
        run: python .github/scripts/tta_v018_patch.py

      - name: Syntax and performance-regression checks
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          assert '@version      0.1.8' in s
          assert "const VERSION = '0.1.8';" in s
          assert 'const perfCache={' in s
          assert 'function ensureTxIndex()' in s
          assert 'function renderItemList()' in s
          assert "root.dataset.delegated==='1'" in s
          assert 'setTimeout(()=>renderItemList(),120)' in s
          assert 'function loadingHtml()' in s
          assert 'function openAnalyzer()' in s
          assert 'content-visibility:auto' in s
          assert 'function resetAnalyticsCache()' in s
          assert "querySelectorAll('[data-act]').forEach" not in s

          scan=s[s.index('  async function scanLogWindow'):s.index('\n\n  async function fetchFilteredHistory')]
          assert 'render();' not in scan, 'historical paging still full-renders the app'
          assert 'setSyncProgress(' in scan

          card=s[s.index('  function itemCard('):s.index('\n\n  function addItemHtml')]
          assert 'if(exp){' in card
          assert card.index('if(exp){') < card.index('profitSeries(item.id)'), 'closed cards still build hidden charts'

          sync=s[s.index('  async function syncAll()'):s.index('\n\n  function demoCatalog')]
          assert sync.count('render();') == 1, f'sync should render once at completion, found {sync.count("render();")}'
          assert "setBusy(true,'Syncing trade history'" in sync

          print('PASS: v0.1.8 static UX/performance checks')
          PY
          printf 'PASS: v0.1.8 syntax + cached analytics + delegated events + lazy charts + progressive loading\n' > .tta-v018-status.txt

      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v018-status.txt
          git commit -m 'Optimize Torn Trade Analyzer performance and UX'
          git push origin HEAD:main
