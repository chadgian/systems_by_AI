name: Torn Trade Analyzer v0.1.5 hotfix

on:
  push:
    branches: [main]
    paths:
      - '.tta-v015-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch, verify, and report status
        shell: bash
        run: |
          set +e
          python .tta-v015-patch.py > .tta-v015-status.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> .tta-v015-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tta-v015-status.txt
          if [ "$rc" -eq 0 ]; then
            git add torn-trade-analyzer.user.js
          fi
          git commit -m "Report Torn Trade Analyzer v0.1.5 publisher status" || true
          git push origin HEAD:main
          exit "$rc"
