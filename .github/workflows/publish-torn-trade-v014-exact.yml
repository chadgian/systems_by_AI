name: Publish exact Torn Trade Analyzer v0.1.4

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.title == 'Publish Torn Trade Analyzer v0.1.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rebuild verified userscript on PR branch
        shell: bash
        run: |
          for f in .tmp_tta_v014/gz00.b64 .tmp_tta_v014/gz01.b64 .tmp_tta_v014/gz02.b64 .tmp_tta_v014/gz03.b64 .tmp_tta_v014/gz04.b64 .tmp_tta_v014/gz05.b64; do
            printf '%s: ' "$f"
            wc -c < "$f"
            bad="$(LC_ALL=C tr -d 'A-Za-z0-9+/=\r\n\t ' < "$f" | wc -c)"
            echo "non-base64-bytes: $bad"
          done
          cat .tmp_tta_v014/gz00.b64 .tmp_tta_v014/gz01.b64 .tmp_tta_v014/gz02.b64 .tmp_tta_v014/gz03.b64 .tmp_tta_v014/gz04.b64 .tmp_tta_v014/gz05.b64 | tr -d '\r\n\t ' > /tmp/tta.b64
          echo "combined-base64-bytes: $(wc -c < /tmp/tta.b64)"
          test "$(wc -c < /tmp/tta.b64)" = "22856"
          base64 -d /tmp/tta.b64 > /tmp/tta.js.gz
          gzip -t /tmp/tta.js.gz
          gzip -dc /tmp/tta.js.gz > torn-trade-analyzer.user.js
          test "$(wc -c < torn-trade-analyzer.user.js)" = "57298"
          test "$(git hash-object torn-trade-analyzer.user.js)" = "f75472be028899ab9fc0d044a7740053e8125e13"
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.4' torn-trade-analyzer.user.js
          grep -q 'function nextLogPageParams' torn-trade-analyzer.user.js
          grep -q 'previousScroll' torn-trade-analyzer.user.js
          grep -q 'Last scan:' torn-trade-analyzer.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Fix accordion scroll and Torn log compatibility'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
