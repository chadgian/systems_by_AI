name: Publish exact Torn Trade Analyzer v0.1.4

on:
  push:
    paths:
      - '.github/workflows/publish-torn-trade-v014-exact.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild verified userscript
        shell: bash
        run: |
          cat .tmp_tta_v014/chunk0.b64 .tmp_tta_v014/chunk1.b64 .tmp_tta_v014/chunk2.b64 > /tmp/tta.b64
          base64 -d /tmp/tta.b64 > /tmp/tta.js.gz
          gzip -dc /tmp/tta.js.gz > torn-trade-analyzer.user.js
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.4' torn-trade-analyzer.user.js
          grep -q 'function nextLogPageParams' torn-trade-analyzer.user.js
          grep -q 'previousScroll' torn-trade-analyzer.user.js
          grep -q 'Last scan:' torn-trade-analyzer.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Fix accordion scroll and Torn log compatibility'
          git push
