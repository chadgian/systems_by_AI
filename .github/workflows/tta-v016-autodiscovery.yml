name: Torn Trade Analyzer v0.1.6 auto discovery

on:
  push:
    branches: [main]
    paths:
      - '.tta-v016-trigger'

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript to v0.1.6
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('torn-trade-analyzer.user.js')
          s=p.read_text()
          assert '// @version      0.1.5' in s
          assert "const VERSION = '0.1.5';" in s
          s=s.replace('// @version      0.1.5','// @version      0.1.6',1)
          s=s.replace("const VERSION = '0.1.5';","const VERSION = '0.1.6';",1)
          s=s.replace('Track selected Torn items, backfill buy/sell logs, calculate FIFO realized profit, and chart profit by day/week/month. Data stays on-device.','Automatically discover items from Torn history, calculate FIFO realized profit, and chart profit by day/week/month. Data stays on-device.',1)

          state_needle="    fabPosition: load('fabPosition', null),\n    sync: load('sync', { lastSync: 0, firstSyncComplete: false }),"
          assert state_needle in s
          s=s.replace(state_needle,"    fabPosition: load('fabPosition', null),\n    pinnedIds: load('pinnedIds', []),\n    itemSearch: load('itemSearch', ''),\n    sortMode: load('sortMode', 'recent'),\n    sync: load('sync', { lastSync: 0, firstSyncComplete: false }),",1)

          css_needle='.tta-linkrow{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px}\n      .tta-search'
          assert css_needle in s
          css_new='.tta-linkrow{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px}\n      .tta-listtools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin:8px 0 4px}.tta-history-search{width:100%;min-height:42px;border-radius:11px;border:1px solid var(--tta-line);background:var(--tta-card);color:var(--tta-text)!important;padding:10px 12px;font-size:12px;outline:none}.tta-history-search::placeholder{color:var(--tta-faint)}.tta-history-search:focus{border-color:var(--tta-blue);box-shadow:0 0 0 2px #7fc1ff22}.tta-sortbtn{min-width:118px}.tta-pin{display:grid;place-items:center;width:31px;height:31px;min-width:31px;min-height:31px;margin:0 0 4px auto;padding:0;border:1px solid var(--tta-line);border-radius:9px;background:#0d151d;color:var(--tta-muted)!important;font-size:15px;line-height:1}.tta-pin.active{background:#2a2513;border-color:#71632e;color:var(--tta-yellow)!important}.tta-listmeta{font-size:10px;color:var(--tta-muted);text-align:center;margin:0 0 10px}\n      @media(max-width:460px){.tta-listtools{grid-template-columns:1fr}.tta-sortbtn{width:100%}}\n      .tta-search'
          s=s.replace(css_needle,css_new,1)

          old_effective="""  function effectiveTracked() {
    if (state.tracked.length || !state.demo) return state.tracked;
    return demoTracked();
  }
"""
          assert old_effective in s
          new_effective="""  function catalogItem(id) {
    id=Number(id);
    const found=(state.catalog||[]).find(x=>Number(x.id)===id);
    return found || {id,name:`Item #${id}`,type:'Item',image:`https://www.torn.com/images/items/${id}/large.png`,marketPrice:0};
  }
  function effectiveTracked() {
    const tx=effectiveTransactions();
    const ids=[...new Set(tx.map(x=>Number(x.itemId)).filter(x=>x>0))];
    if(!ids.length && state.demo)return demoTracked();
    return ids.map(catalogItem).sort((a,b)=>a.name.localeCompare(b.name)||a.id-b.id);
  }
  const SORT_OPTIONS=[
    {id:'recent',label:'Recent'},
    {id:'profit',label:'Profit'},
    {id:'acquired',label:'Acquired'},
    {id:'sold',label:'Sold'},
    {id:'name',label:'Name'}
  ];
  function sortLabel(){return SORT_OPTIONS.find(x=>x.id===state.sortMode)?.label||'Recent';}
  function historyItemRows() {
    const q=String(state.itemSearch||'').trim().toLowerCase();
    const pinned=new Set((state.pinnedIds||[]).map(Number));
    const lastById=new Map();
    effectiveTransactions().forEach(t=>{const id=Number(t.itemId),ts=Number(t.timestamp)||0;if(id>0&&ts>(lastById.get(id)||0))lastById.set(id,ts);});
    const rows=effectiveTracked()
      .filter(item=>!q || item.name.toLowerCase().includes(q) || String(item.id).includes(q))
      .map(item=>({item,summary:summaryFor(item.id),lastActivity:lastById.get(Number(item.id))||0,pinned:pinned.has(Number(item.id))}));
    rows.sort((a,b)=>{
      if(a.pinned!==b.pinned)return a.pinned?-1:1;
      let d=0;
      if(state.sortMode==='profit')d=b.summary.profit-a.summary.profit;
      else if(state.sortMode==='acquired')d=b.summary.bought-a.summary.bought;
      else if(state.sortMode==='sold')d=b.summary.sold-a.summary.sold;
      else if(state.sortMode==='name')d=a.item.name.localeCompare(b.item.name);
      else d=b.lastActivity-a.lastActivity;
      return d || a.item.name.localeCompare(b.item.name) || a.item.id-b.item.id;
    });
    return rows;
  }
"""
          s=s.replace(old_effective,new_effective,1)

          dash_start=s.index('  function dashboardHtml() {')
          dash_end=s.index('\n  function itemCard(',dash_start)
          new_dash="""  function dashboardHtml() {
    const s=overall(), rows=historyItemRows(), allItems=effectiveTracked(), range=dateRange();
    const pinnedCount=(state.pinnedIds||[]).filter(id=>allItems.some(x=>Number(x.id)===Number(id))).length;
    const periodLabel = state.dateMode==='all'?'All available history':`${dateStr(range.from)} – ${dateStr(Math.min(range.to,nowSec()))}`;
    return `${header('Trade Analyzer', `v${VERSION} · FIFO realized profit`)}<div class="tta-content">
      ${!hasApiKey()?`<div class="tta-banner"><strong>Preview mode.</strong> Add your Torn API key in <strong>Settings → API Key</strong> (or use Torn PDA's injected key) to load your real history. The key and analyzed data stay on this device.</div>`:''}
      ${hasApiKey()&&!state.sync?.autoDiscoveryComplete?`<div class="tta-banner"><strong>v${VERSION} auto-discovery:</strong> Run Sync once to discover every recognizable item in your Torn acquisition and sale history. Manual item tracking is no longer required.</div>`:''}
      <div class="tta-period"><div><small>Date period</small><br><strong>${esc(periodLabel)}</strong></div><button class="tta-btn secondary" data-act="sync" ${state.syncing?'disabled':''}>${state.syncing?'<span class="tta-sync"><span class="tta-spinner"></span>Syncing</span>':'↻ Sync'}</button></div>
      ${state.syncProgress?`<div class="tta-banner">${esc(state.syncProgress)} ${state.syncing?'<button class="tta-btn danger" data-act="cancelSync" style="min-height:30px;padding:5px 9px;margin-left:8px;vertical-align:middle">Stop</button>':''}</div>`:''}
      <div class="tta-chips">${[['7d','7 days'],['30d','30 days'],['month','This month'],['all','All'],['custom','Custom']].map(([k,l])=>`<button class="tta-chip ${state.dateMode===k?'active':''}" data-date="${k}">${l}</button>`).join('')}</div>
      ${state.dateMode==='custom'?`<div class="tta-customdates"><input type="date" data-custom="from" value="${esc(state.customFrom)}"><input type="date" data-custom="to" value="${esc(state.customTo)}"></div>`:''}
      <div class="tta-summary"><div class="tta-stat main"><label>Realized profit</label><b class="${s.profit>=0?'pos':'neg'}">${money(s.profit)}</b></div><div class="tta-stat"><label>Acquired</label><b>${qty(s.bought)}</b></div><div class="tta-stat"><label>Sold</label><b>${qty(s.sold)}</b></div></div>
      <div class="tta-chartcard"><div class="tta-charthead"><h3>Profit earned</h3><div class="tta-seg">${['day','week','month'].map(g=>`<button class="${state.granularity===g?'active':''}" data-gran="${g}">${g[0].toUpperCase()+g.slice(1)}</button>`).join('')}</div></div>${chartSvg(profitSeries())}</div>
      <div class="tta-sectionhead"><h3>Items in your history · ${allItems.length}</h3></div>
      <div class="tta-listtools"><input id="tta-history-search" class="tta-history-search" placeholder="Search item name or ID…" value="${esc(state.itemSearch||'')}" autocomplete="off" aria-label="Search discovered items"><button class="tta-btn secondary tta-sortbtn" data-act="cycleSort">⇅ Sort: ${esc(sortLabel())}</button></div>
      <div class="tta-listmeta">${qty(rows.length)} shown · ${qty(pinnedCount)} pinned · pins always stay on top</div>
      ${rows.length?rows.map(r=>itemCard(r.item,r.summary)).join(''):`<div class="tta-empty">${allItems.length?'No items match your search.':'No item history has been discovered yet. Press Sync to scan your Torn logs.'}</div>`}
    </div>`;
  }
"""
          s=s[:dash_start]+new_dash+s[dash_end:]

          card_start=s.index('  function itemCard(')
          card_end=s.index('\n\n  function addItemHtml()',card_start)
          new_card="""  function itemCard(item, precomputed=null) {
    const s=precomputed||summaryFor(item.id), exp=Number(state.expanded)===Number(item.id), series=profitSeries(item.id);
    const pinned=(state.pinnedIds||[]).map(Number).includes(Number(item.id));
    const src=s.sources.length?s.sources.slice(0,3).join(' · '):'No acquisitions in selected period';
    const avgBuy=s.bought?s.buySpend/s.bought:0, avgSell=s.sold?s.sellRevenue/s.sold:0;
    const freeQty=s.events.filter(x=>x.side==='buy'&&x.free).reduce((n,x)=>n+x.qty,0);
    return `<div class="tta-item ${exp?'expanded':''}" data-item="${item.id}"><div class="tta-itemtop" data-act="toggleItem" data-id="${item.id}" role="button" tabindex="0" aria-expanded="${exp?'true':'false'}">${itemIcon(item)}<div class="tta-itemcopy"><div class="tta-itemname">${esc(item.name)}</div><div class="tta-source">${esc(src)}</div></div><div class="tta-profitbox"><button class="tta-pin ${pinned?'active':''}" data-act="togglePin" data-id="${item.id}" aria-pressed="${pinned?'true':'false'}" title="${pinned?'Unpin item':'Pin item to top'}">${pinned?'📌':'☆'}</button><div class="tta-profit ${s.profit>=0?'pos':'neg'}">${money(s.profit,true)}</div><div class="tta-chevron">${exp?'▲ details':'▼ details'}</div></div></div><div class="tta-metrics"><div class="tta-metric"><small>Acquired</small><b>${qty(s.bought)}</b></div><div class="tta-metric"><small>Sold</small><b>${qty(s.sold)}</b></div><div class="tta-metric"><small>Profit</small><b class="${s.profit>=0?'pos':'neg'}">${money(s.profit,true)}</b></div></div><div class="tta-accordion"><div class="tta-minirow"><div class="tta-ministat"><small>Avg cost</small><b>${money(avgBuy,true)}</b></div><div class="tta-ministat"><small>Avg sell</small><b>${money(avgSell,true)}</b></div><div class="tta-ministat"><small>Inventory</small><b>${qty(s.remainingQty)}</b></div></div><div class="tta-charthead"><h3>${esc(item.name)} profit</h3><small>${s.events.length} events</small></div>${chartSvg(series,92)}<div class="tta-note">Profit uses FIFO: each sale is matched against your oldest recorded purchases. ${s.unmatched?`⚠ ${qty(s.unmatched)} sold item(s) have no earlier recorded acquisition cost, so those units are excluded from realized profit.`:'All sold units in this period have recorded cost basis.'}${freeQty?` · ${qty(freeQty)} free-acquired item(s) use a $0 cost basis.`:''}</div></div></div>`;
  }
"""
          s=s[:card_start]+new_card+s[card_end:]

          s=s.replace("  if (!hasApiKey() && !state.tracked.length && !state.transactions.length) state.demo=true; else state.demo=false;","  if (!hasApiKey() && !state.transactions.length) state.demo=true; else state.demo=false;",1)

          action_needle="      else if(act==='toggleItem'){state.expanded=Number(state.expanded)===Number(el.dataset.id)?null:Number(el.dataset.id);render();}\n      else if(act==='confirmAdd')"
          assert action_needle in s
          action_new="""      else if(act==='toggleItem'){state.expanded=Number(state.expanded)===Number(el.dataset.id)?null:Number(el.dataset.id);render();}
      else if(act==='togglePin'){
        const id=Number(el.dataset.id),pins=new Set((state.pinnedIds||[]).map(Number));
        if(pins.has(id))pins.delete(id);else pins.add(id);
        state.pinnedIds=[...pins];save('pinnedIds',state.pinnedIds);render();
      }
      else if(act==='cycleSort'){
        const i=Math.max(0,SORT_OPTIONS.findIndex(x=>x.id===state.sortMode));
        state.sortMode=SORT_OPTIONS[(i+1)%SORT_OPTIONS.length].id;save('sortMode',state.sortMode);render();
      }
      else if(act==='confirmAdd')"""
          s=s.replace(action_needle,action_new,1)

          input_needle="    const si=document.getElementById('tta-search'); if(si) si.addEventListener('input',()=>{state.search=si.value; render(); const n=document.getElementById('tta-search');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}});"
          assert input_needle in s
          input_new=input_needle+"\n    const hi=document.getElementById('tta-history-search');if(hi)hi.addEventListener('input',()=>{state.itemSearch=hi.value;save('itemSearch',state.itemSearch);render();const n=document.getElementById('tta-history-search');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}});"
          s=s.replace(input_needle,input_new,1)

          old_save="if(state.tracked.length){toast(`API key confirmed (${info.type||'access level '+info.level}). Starting historical sync…`);await syncAll();}else toast(`API key saved · ${info.type||'access level '+info.level}.`);"
          assert old_save in s
          s=s.replace(old_save,"toast(`API key confirmed (${info.type||'access level '+info.level}). Starting history discovery…`);await syncAll();",1)

          old_reset="else if(act==='resetData'){if(confirm('Reset all Torn Trade Analyzer tracked items and local transaction data?')){['tracked','transactions','sync'].forEach(k=>localStorage.removeItem(NS+k));state.tracked=[];state.transactions=[];state.sync={lastSync:0,firstSyncComplete:false};state.expanded=null;toast('Analyzer data reset.');}}"
          assert old_reset in s
          new_reset="else if(act==='resetData'){if(confirm('Reset all Torn Trade Analyzer discovered item history and local transaction data?')){['tracked','transactions','sync','pinnedIds','itemSearch','sortMode'].forEach(k=>localStorage.removeItem(NS+k));state.tracked=[];state.transactions=[];state.pinnedIds=[];state.itemSearch='';state.sortMode='recent';state.sync={lastSync:0,firstSyncComplete:false};state.expanded=null;toast('Analyzer data reset.');}}"
          s=s.replace(old_reset,new_reset,1)

          parser_old="return items.filter(it=>state.tracked.some(t=>Number(t.id)===Number(it.id))).map(it=>{"
          assert parser_old in s
          s=s.replace(parser_old,"return items.map(it=>{",1)

          s=s.replace("    if(!state.tracked.length){toast('Add at least one item first.');return;}\n",'',1)
          tx_old="state.transactions=[...merged.values()].filter(t=>state.tracked.some(i=>Number(i.id)===Number(t.itemId))).sort((a,b)=>a.timestamp-b.timestamp);"
          assert tx_old in s
          s=s.replace(tx_old,"state.transactions=[...merged.values()].sort((a,b)=>a.timestamp-b.timestamp);",1)
          sync_save_old="state.sync.lastSync=nowSec();state.sync.firstSyncComplete=!state.syncCancel;state.sync.diagnostics=scan.diagnostics;save('sync',state.sync);"
          assert sync_save_old in s
          s=s.replace(sync_save_old,"state.sync.lastSync=nowSec();state.sync.firstSyncComplete=!state.syncCancel;state.sync.autoDiscoveryComplete=!state.syncCancel;state.sync.diagnostics=scan.diagnostics;save('sync',state.sync);",1)
          s=s.replace('raw logs scanned but no tracked-item rows parsed.','raw logs scanned but no recognizable item rows were parsed.',1)
          s=s.replace('tracked rows stored','item history rows stored',1)

          s=s.replace('personal statistical analysis of selected item acquisitions and sales.','personal statistical analysis of automatically discovered item acquisitions and sales.',1)
          s=s.replace("Reset all Torn Trade Analyzer tracked items and local transaction data?","Reset all Torn Trade Analyzer discovered item history and local transaction data?",1)

          p.write_text(s)
          PY
      - name: Syntax and behavior tests
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.6' torn-trade-analyzer.user.js
          grep -q 'historyItemRows' torn-trade-analyzer.user.js
          grep -q "data-act=\"togglePin\"" torn-trade-analyzer.user.js
          grep -q 'Items in your history' torn-trade-analyzer.user.js
          grep -q "return items.map(it=>" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          old="""  // Keep the UI alive through Torn's SPA navigation and delayed DOM swaps.
  const boot=()=>{if(document.body)mount();else setTimeout(boot,250)}; boot();
  setInterval(()=>{if(!document.getElementById('tta-fab')||!document.getElementById('tta-root'))mount();},5000);
})();
"""
          new="""  globalThis.__tta_test={state,effectiveTracked,historyItemRows,parseLogEntry,summaryFor,SORT_OPTIONS};
})();
"""
          assert old in s
          Path('/tmp/tta-testable.js').write_text(s.replace(old,new,1))
          PY
          node <<'NODE'
          const fs=require('fs');
          global.localStorage={getItem:()=>null,setItem:()=>{},removeItem:()=>{}};
          global.window={};global.document={};global.confirm=()=>true;
          eval(fs.readFileSync('/tmp/tta-testable.js','utf8'));
          const t=global.__tta_test;
          if(!t)throw new Error('test hook missing');
          const now=Math.floor(Date.now()/1000);
          t.state.demo=false;t.state.dateMode='all';
          t.state.catalog=[
            {id:274,name:'Panda Plushie',type:'Plushie',image:''},
            {id:258,name:'Jaguar Plushie',type:'Plushie',image:''}
          ];
          t.state.transactions=[
            {id:'a',timestamp:now-400,itemId:274,side:'buy',qty:10,total:1000,netTotal:1000,source:'Foreign Market',title:'Foreign buy'},
            {id:'b',timestamp:now-300,itemId:274,side:'sell',qty:5,total:1000,netTotal:1000,source:'Item Market',title:'Market sell'},
            {id:'c',timestamp:now-200,itemId:258,side:'buy',qty:20,total:2000,netTotal:2000,source:'Foreign Market',title:'Foreign buy'},
            {id:'d',timestamp:now-100,itemId:258,side:'sell',qty:5,total:400,netTotal:400,source:'Item Market',title:'Market sell'}
          ];
          t.state.tracked=[];
          if(t.effectiveTracked().length!==2)throw new Error('auto discovery failed');
          t.state.pinnedIds=[258];t.state.sortMode='profit';t.state.itemSearch='';
          let rows=t.historyItemRows();
          if(rows[0].item.id!==258)throw new Error('pin does not override sorting');
          t.state.pinnedIds=[];rows=t.historyItemRows();
          if(rows[0].item.id!==274)throw new Error('profit sorting failed');
          t.state.itemSearch='jaguar';rows=t.historyItemRows();
          if(rows.length!==1||rows[0].item.id!==258)throw new Error('search failed');
          const parsed=t.parseLogEntry({id:'x',timestamp:now,details:{id:4201,title:'Item abroad buy'},data:{item:274,quantity:2,cost_each:100},params:{}});
          if(parsed.length!==1||parsed[0].itemId!==274||parsed[0].qty!==2)throw new Error('parser still depends on manual tracking');
          console.log('v0.1.6 behavioral tests passed');
          NODE
      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Auto-discover traded items with search sort and pins'
          git push origin HEAD:main
