name: Torn Trade Analyzer v0.1.12 minimize sync fallback

on:
  push:
    branches: [main]
    paths:
      - '.tta-v0112-trigger'

permissions:
  contents: write

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta_v0112_patch.py
      - name: Verify
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.12' torn-trade-analyzer.user.js
          grep -q "function updateFabState()" torn-trade-analyzer.user.js
          grep -q "data-act=\"minimizeSync\"" torn-trade-analyzer.user.js
          grep -q "tta-fab.syncing" torn-trade-analyzer.user.js
          grep -q "tta-fabspinner" torn-trade-analyzer.user.js
          grep -q "if(!state.syncing)setBusy(false)" torn-trade-analyzer.user.js
          grep -q "state.syncing=true;state.syncCancel=false;updateFabState()" torn-trade-analyzer.user.js
          grep -q "state.syncing=false;updateFabState();setBusy(false);render()" torn-trade-analyzer.user.js
          printf 'PASS: v0.1.12 syntax + minimizable background sync + light-red floating spinner + reopen-safe busy state\n' > .tta-v0112-status.txt
      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v0112-status.txt
          git commit -m 'Torn Trade Analyzer v0.1.12 minimize sync'
          git push origin HEAD:main
