name: Torn Trade Analyzer v0.1.20 chart spacing

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'publish-tta-v0120-chart-spacing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/tta_v0120_patch.py
      - name: Verify JavaScript syntax
        run: node --check torn-trade-analyzer.user.js
      - name: Verify chart layout behavior
        shell: python
        run: |
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          checks=[
            '// @version      0.1.20',
            "const dayMode=state.granularity==='day'",
            'series.length*30',
            'tta-chartviewport',
            "tip.style.top='4px'",
            'positionDailyChartsToLatest',
            'scrollLeft=Math.max(0,v.scrollWidth-v.clientWidth)',
          ]
          for c in checks: assert c in s, c
          assert 'br.bottom-wr.top' not in s
          # Day-mode spacing fixture: 30 buckets should produce a canvas wider than 360.
          padL,padR,n=52,8,30
          w=max(360,padL+padR+n*30)
          assert w==960
          gap=(w-padL-padR)/n
          assert gap==30
          Path('.tta-v0120-status.txt').write_text('PASS: v0.1.20 syntax + spacious scrollable day chart + top tooltip + latest-date positioning\n')
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js .tta-v0120-status.txt
          git commit -m "Torn Trade Analyzer v0.1.20 improve daily chart spacing"
          git push
