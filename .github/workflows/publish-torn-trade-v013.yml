name: Publish Torn Trade Analyzer v0.1.3

on:
  push:
    paths:
      - '.github/workflows/publish-torn-trade-v013.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write verified userscript
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib
          payload = (
          ""
          )
          pathlib.Path('torn-trade-analyzer.user.js').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Commit userscript
        shell: bash
        run: |
          git config user.name "ChatGPT Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add torn-trade-analyzer.user.js
          if git diff --cached --quiet; then
            echo "No userscript changes to publish"
          else
            git commit -m "Add movable launcher, API key settings, and free acquisitions"
            git push
          fi
