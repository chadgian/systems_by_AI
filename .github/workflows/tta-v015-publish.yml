name: Torn Trade Analyzer v0.1.15 incremental sync

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.event.issue.title == 'publish-tta-v015-incremental-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta_v015_patch.py
      - name: Verify
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.15' torn-trade-analyzer.user.js
          grep -q 'SYNC_CACHE_SCHEMA_VERSION = 1' torn-trade-analyzer.user.js
          grep -q 'INCREMENTAL_OVERLAP_SEC = 300' torn-trade-analyzer.user.js
          grep -q 'already verified, skipped' torn-trade-analyzer.user.js
          grep -q 'fetching missing detailed trade' torn-trade-analyzer.user.js
          grep -q 'existingRowsSkipped' torn-trade-analyzer.user.js
          grep -q 'tradeDetailsSkipped' torn-trade-analyzer.user.js
          grep -q "ensureLogTypes(false)" torn-trade-analyzer.user.js
          grep -q "REQUEST_GAP_MS = 700" torn-trade-analyzer.user.js
          grep -q "Player trades already fully covered" torn-trade-analyzer.user.js
          grep -q "if(inPeriod&&!current)continue" torn-trade-analyzer.user.js && exit 1 || true
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          assert "if(resumableTxMap.has(key))" in s
          assert "commitTradeVerifications(job);updateSyncCoverage(job);" in s
          assert "tradeScanPeriod=incrementalPeriod(period,'trade')" in s
          assert "logScanPeriod=incrementalPeriod(period,'log')" in s
          assert "if((Number(job.diagnostics?.rawRows)||0)===0&&!job.logScanPeriod?.incremental)" in s
          assert "['tracked','transactions','sync','syncJob','syncCache','logTypesUpdatedAt'" in s
          print('PASS: incremental merge + trade detail skip + coverage windows + syntax')
          PY
          printf 'PASS: v0.1.15 incremental missing-data sync + verified-trade skipping + merge-only cache + reduced API requests\n' > .tta-v015-status.txt
      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v015-status.txt
          git commit -m 'Torn Trade Analyzer v0.1.15 incremental sync'
          git push origin HEAD:main
