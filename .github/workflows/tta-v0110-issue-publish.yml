name: Torn Trade Analyzer v0.1.10 item details

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.event.issue.title == 'publish-tta-v0110-item-details'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta_v0110_patch.py
      - name: Verify
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.10' torn-trade-analyzer.user.js
          grep -q "catalogUpdatedAt: load('catalogUpdatedAt', 0)" torn-trade-analyzer.user.js
          grep -q 'catalogAge<6\*3600' torn-trade-analyzer.user.js
          grep -q 'tta-factpill market' torn-trade-analyzer.user.js
          grep -q 'Market value' torn-trade-analyzer.user.js
          grep -q 'Recorded inventory value' torn-trade-analyzer.user.js
          grep -q 'FIFO cost basis' torn-trade-analyzer.user.js
          grep -Fq "marketPrice:Number(x.value?.market_price)||0" torn-trade-analyzer.user.js
          printf 'PASS: v0.1.10 syntax + market value + item metadata + inventory value + 6h catalog refresh\n' > .tta-v0110-status.txt
      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v0110-status.txt
          git commit -m 'Torn Trade Analyzer v0.1.10 item details'
          git push origin HEAD:main
