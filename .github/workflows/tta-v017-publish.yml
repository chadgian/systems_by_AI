name: Torn Trade Analyzer v0.1.17 acquisition ledger

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.event.issue.title == 'publish-tta-v017-acquisition-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta_v017_patch.py
      - name: Verify userscript
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.17' torn-trade-analyzer.user.js
          grep -q 'function acquisitionLedgerRows()' torn-trade-analyzer.user.js
          grep -q 'function filteredLedgerRows()' torn-trade-analyzer.user.js
          grep -q "state.view==='ledger'?ledgerHtml()" torn-trade-analyzer.user.js
          grep -q 'data-act="ledgerSort"' torn-trade-analyzer.user.js
          grep -q 'data-ledger-filter="source"' torn-trade-analyzer.user.js
          grep -q 'data-ledger-filter="status"' torn-trade-analyzer.user.js
          grep -q 'data-ledger-filter="range"' torn-trade-analyzer.user.js
          grep -q 'Load 200 more' torn-trade-analyzer.user.js
          grep -q "row.realizedProfit=row.soldProceeds-row.realizedCost" torn-trade-analyzer.user.js
          grep -q "saleUnit=q?net/q:0" torn-trade-analyzer.user.js
          python - <<'PY'
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          assert "if(t.side==='buy')" in s
          assert "else if(t.side==='sell')" in s
          assert "take=Math.min(remain,lot.remaining)" in s
          assert "row.soldQty+=take" in s
          assert "row.soldProceeds+=take*saleUnit" in s
          assert "row.realizedCost+=take*lot.unit" in s
          assert "row.status=row.soldQty<=1e-9?'unsold':row.unsoldQty<=1e-9?'sold':'partial'" in s
          assert "Player Trade acquisition/sale values use the analyzer's market-value allocation plus the equal cash surplus/deficit rule" in s
          print('FIFO ledger assertions passed')
          PY
          printf 'PASS: v0.1.17 syntax + acquisition FIFO ledger + sortable/filterable/searchable table + chunked rendering\n' > .tta-v017-status.txt
      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v017-status.txt
          git commit -m 'Torn Trade Analyzer v0.1.17 acquisition ledger'
          git push origin HEAD:main
