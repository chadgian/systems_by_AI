name: Torn Trade Analyzer v0.1.19 interactive chart

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'publish-tta-v019-interactive-chart'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/tta_v019_patch.py
      - name: Verify JavaScript syntax
        run: node --check torn-trade-analyzer.user.js
      - name: Verify interactive chart behavior
        shell: python
        run: |
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          checks=[
            '// @version      0.1.19',
            'tta-chartinteractive',
            'tta-charttooltip',
            'data-profit=',
            'data-time=',
            "showChartTooltip(bar,true)",
            "root.addEventListener('pointerover'",
            "root.addEventListener('focusin'",
            'Interactive profit chart; hover or tap a bar for exact profit',
          ]
          for c in checks: assert c in s, c
          Path('.tta-v019-status.txt').write_text('PASS: v0.1.19 syntax + hover/tap/focus exact-profit tooltip + mobile pinning\n')
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js .tta-v019-status.txt
          git commit -m "Torn Trade Analyzer v0.1.19 interactive profit chart"
          git push
