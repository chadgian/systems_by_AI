name: Torn Trade Analyzer v0.1.16 coverage safety

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.event.issue.title == 'publish-tta-v016-coverage-safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta_v016_patch.py
      - name: Verify
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.16' torn-trade-analyzer.user.js
          grep -q 'rawFrom==null?NaN:Number(rawFrom)' torn-trade-analyzer.user.js
          grep -q 'rawOldFrom==null?NaN:Number(rawOldFrom)' torn-trade-analyzer.user.js
          grep -q 'Math.min(p.to,nowSec())' torn-trade-analyzer.user.js
          grep -q 'already verified, skipped' torn-trade-analyzer.user.js
          grep -q 'tradeDetailsSkipped' torn-trade-analyzer.user.js
          grep -q 'existingRowsSkipped' torn-trade-analyzer.user.js
          printf 'PASS: v0.1.16 incremental cache boundaries + syntax + verified-trade skip retained\n' > .tta-v016-status.txt
      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v016-status.txt
          git commit -m 'Torn Trade Analyzer v0.1.16 coverage safety'
          git push origin HEAD:main
