name: Torn Trade Analyzer v0.1.7 issue publisher

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.issue.title == 'publish-tta-v017-period-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta_v017_patch.py
      - name: Verify userscript
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.7' torn-trade-analyzer.user.js
          grep -q "fab.style.display=state.open?'none':'inline-flex'" torn-trade-analyzer.user.js
          grep -q "\['month','1 month'\]" torn-trade-analyzer.user.js
          grep -q 'params.from=period.from' torn-trade-analyzer.user.js
          grep -q 'row.summary.events.length>0' torn-trade-analyzer.user.js
          grep -q 'coverageFrom' torn-trade-analyzer.user.js
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('torn-trade-analyzer.user.js','utf8');
          const start=src.indexOf('  function subtractCalendarMonth(date) {');
          const end=src.indexOf('\n\n  function dateRange()',start);
          if(start<0||end<0)throw new Error('period helper block missing');
          global.state={dateMode:'month',customFrom:'',customTo:''};
          eval(src.slice(start,end));
          const input=new Date('2026-08-08T10:26:00Z');
          const b=selectedPeriodBounds(input);
          const d=new Date(b.from*1000);
          if(d.getUTCFullYear()!==2026||d.getUTCMonth()!==6||d.getUTCDate()!==8)throw new Error('1 month is not July 8 -> Aug 8');
          state.dateMode='7d';
          const b7=selectedPeriodBounds(input);
          if(Math.round((b7.to-60-b7.from)/86400)!==7)throw new Error('7d window incorrect');
          console.log('PASS period math',new Date(b.from*1000).toISOString(),new Date((b.to-60)*1000).toISOString());
          NODE
          printf 'PASS: v0.1.7 syntax + launcher visibility + rolling month + bounded historical crawl\n' > .tta-v017-status.txt
      - name: Publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v017-status.txt
          git commit -m 'Fix period historical scans and launcher visibility'
          git push origin HEAD:main
