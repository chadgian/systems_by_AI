name: Torn Trade Analyzer v0.1.18 acquisition-date profit

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.issue.title == 'publish-tta-v018-acquisition-profit-date'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/tta_v018_patch.py
      - name: Verify JavaScript syntax
        run: node --check torn-trade-analyzer.user.js
      - name: Verify attribution semantics
        shell: python
        run: |
          from pathlib import Path
          s=Path('torn-trade-analyzer.user.js').read_text()
          checks=[
            "// @version      0.1.18",
            "profit=acquisitionAttributedProfit(id,from,to);",
            "const k=keyFn(row.acquiredAt)",
            "Profit · acquisition date",
            "Profit by acquisition date",
            "ledgerRowsForItem(itemId)",
          ]
          for c in checks: assert c in s, c
          assert "const k=keyFn(x.timestamp)" not in s
          # Behavioral fixture: a lot bought on day 10 and sold on day 15 belongs to day 10.
          buy_day=10; sale_day=15; cost=100; proceeds=130
          realized=proceeds-cost
          buckets={}
          buckets[buy_day]=buckets.get(buy_day,0)+realized
          assert buckets=={10:30}
          assert sale_day not in buckets
          Path('.tta-v018-status.txt').write_text('PASS: v0.1.18 syntax + acquisition-date profit attribution + FIFO ledger reuse + sale-date metrics preserved\n')
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add torn-trade-analyzer.user.js .tta-v018-status.txt
          git commit -m "Torn Trade Analyzer v0.1.18 acquisition-date profit attribution"
          git push
