name: Torn Trade Analyzer v0.1.14 sold-item fix

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.event.issue.title == 'publish-tta-v014-sold-item-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta_v014_patch.py
      - name: Verify
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.14' torn-trade-analyzer.user.js
          grep -q "\[4210, {side:'sell', source:'Torn Shop'}\]" torn-trade-analyzer.user.js
          grep -q "checking detailed trade #" torn-trade-analyzer.user.js
          ! grep -q "summaryItems===0" torn-trade-analyzer.user.js
          grep -q "tradeSoldQty" torn-trade-analyzer.user.js
          grep -q "outgoing items from authoritative completed player-trade details" torn-trade-analyzer.user.js
          printf 'PASS: v0.1.14 syntax + city shop sale + exhaustive completed-trade detail scan + trade sold qty diagnostics\n' > .tta-v014-status.txt
      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v014-status.txt
          git commit -m 'Torn Trade Analyzer v0.1.14 sold-item fix'
          git push origin HEAD:main
