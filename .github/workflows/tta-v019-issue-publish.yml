name: Torn Trade Analyzer v0.1.9 hide items

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  verify-publish:
    if: github.event.issue.title == 'publish-tta-v019-hide-items'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python .github/scripts/tta_v019_patch.py
      - name: Verify
        shell: bash
        run: |
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.9' torn-trade-analyzer.user.js
          grep -q "hiddenIds: load('hiddenIds', \[\])" torn-trade-analyzer.user.js
          grep -q "data-act=\"hideItem\"" torn-trade-analyzer.user.js
          grep -q "data-act=\"restoreItem\"" torn-trade-analyzer.user.js
          grep -q "data-act=\"restoreAllItems\"" torn-trade-analyzer.user.js
          grep -q "!hidden.has(Number(item.id))" torn-trade-analyzer.user.js
          grep -q "save('hiddenIds',state.hiddenIds)" torn-trade-analyzer.user.js
          printf 'PASS: v0.1.9 syntax + persistent hide + restore controls + display-only filtering\n' > .tta-v019-status.txt
      - name: Publish verified userscript
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js .tta-v019-status.txt
          git commit -m 'Torn Trade Analyzer v0.1.9 hide items'
          git push origin HEAD:main
