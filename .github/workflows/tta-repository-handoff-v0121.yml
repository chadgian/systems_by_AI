name: Torn Trade Analyzer repository handoff v0.1.21

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  handoff:
    if: github.event.issue.title == 'handoff-tta-to-torn-trade-v0121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Point installed users to new repository
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('torn-trade-analyzer.user.js')
          s=p.read_text()
          old='https://raw.githubusercontent.com/chadgian/systems_by_AI/main/torn-trade-analyzer.user.js'
          new='https://raw.githubusercontent.com/chadgian/torn-trade/main/torn-trade-analyzer.user.js'
          assert '// @version      0.1.20' in s
          assert "const VERSION = '0.1.20';" in s
          assert s.count(old) >= 2
          s=s.replace('// @version      0.1.20','// @version      0.1.21',1)
          s=s.replace("const VERSION = '0.1.20';","const VERSION = '0.1.21';",1)
          s=s.replace(old,new)
          assert s.count(new) >= 2
          p.write_text(s)
          PY
      - name: Verify JavaScript
        run: node --check torn-trade-analyzer.user.js
      - name: Publish migration handoff
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Torn Trade Analyzer v0.1.21 move updates to torn-trade'
          git push
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close '${{ github.event.issue.number }}' --comment 'Old distribution endpoint now serves v0.1.21 with update/download URLs pointing to chadgian/torn-trade.'
