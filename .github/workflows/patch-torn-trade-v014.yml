name: Verify Torn Trade Analyzer v0.1.4 patch

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.title == 'Apply Torn Trade Analyzer v0.1.4 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch and verify userscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('torn-trade-analyzer.user.js')
          s = p.read_text()

          assert '// @version      0.1.3' in s
          assert "const VERSION = '0.1.3';" in s
          s = s.replace('// @version      0.1.3', '// @version      0.1.4', 1)
          s = s.replace("const VERSION = '0.1.3';", "const VERSION = '0.1.4';", 1)

          render_new = r'''  function render(options={}) {
            const root=document.getElementById('tta-root'); if(!root)return;
            const previousView=root.dataset.view||'';
            const previousShell=root.querySelector('.tta-shell');
            const preserveScroll=options.preserveScroll ?? (previousView===state.view);
            const previousScroll=preserveScroll && previousShell ? previousShell.scrollTop : 0;
            if(!state.open){root.classList.remove('show');return;} root.classList.add('show');
            if (!hasApiKey() && !state.tracked.length && !state.transactions.length) state.demo=true; else state.demo=false;
            if (state.demo && !state.catalog.length) state.catalog=demoCatalog();
            root.innerHTML=`<div class="tta-shell">${state.view==='add'?addItemHtml():state.view==='settings'?settingsHtml():dashboardHtml()}</div>${state.toast?`<div class="tta-toast">${esc(state.toast)}</div>`:''}`;
            root.dataset.view=state.view;
            bind();
            if(preserveScroll){const shell=root.querySelector('.tta-shell');if(shell)shell.scrollTop=previousScroll;}
          }
          '''
          s, n = re.subn(r'  function render\(\) \{.*?\n  \}\n\n  function toast', render_new + '\n  function toast', s, count=1, flags=re.S)
          assert n == 1

          relevant_new = r'''  function relevantLogTypes(all) {
            const paidContext=/(item market|bazaar|abroad|foreign|travel|shop|auction|market)/i;
            const paidAction=/\b(buy|bought|purchase|purchased|sell|sold|sale|listed|listing|win|won)\b/i;
            const itemMovement=/(item|plushie|flower|drug|weapon|armor|armour|temporary).*(buy|bought|purchase|purchased|sell|sold|sale|receive|received|gain|gained|find|found|reward|loot|won|win)|(buy|bought|purchase|purchased|sell|sold|sale|receive|received|gain|gained|find|found|reward|loot|won|win).*(item|plushie|flower|drug|weapon|armor|armour|temporary)/i;
            const freeContext=/(crime success|organized crime success|city find|mission reward|seasonal gift|christmas town|easter egg hunt|halloween basket|job special|company special|event reward|competition reward|reward|loot|items? incoming|item.*received|item.*gained|item.*found)/i;
            const byId=new Map();
            (all||[]).forEach(x=>{
              const id=Number(x?.id),title=String(x?.title||'');
              if(id && ((paidContext.test(title) && paidAction.test(title)) || itemMovement.test(title) || freeContext.test(title) || KNOWN_TRANSACTION_LOGS.has(id))) byId.set(id,{...x,id});
            });
            KNOWN_TRANSACTION_LOGS.forEach((meta,id)=>{if(!byId.has(id))byId.set(id,{id,title:`${meta.source} ${meta.side}`});});
            return [...byId.values()].sort((a,b)=>a.id-b.id);
          }
          '''
          s, n = re.subn(r'  function relevantLogTypes\(all\) \{.*?\n  \}\n  function classify', relevant_new + '  function classify', s, count=1, flags=re.S)
          assert n == 1

          normalize_new = r'''  function normalizeItems(data) {
            data=data||{};
            const out=[];
            const push=(id,q=1)=>{id=Number(id);q=Number(q)||1;if(id>0&&q>0)out.push({id,qty:q});};
            const itemKeys=new Set(['items','item','items_bought','items_sold','item_bought','item_sold','items_gained','item_gained','items_received','item_received','reward_items','reward_item','loot_items','loot_item','found_items','found_item']);
            const visit=(v,defaultQty=1,depth=0)=>{
              if(v==null||depth>8)return;
              if(typeof v==='number' || (typeof v==='string' && /^\d+$/.test(v))){push(v,defaultQty);return;}
              if(Array.isArray(v)){v.forEach(z=>visit(z,defaultQty,depth+1));return;}
              if(typeof v!=='object')return;
              const id=v.id??v.item_id??v.itemId;
              const hasQty=('qty'in v)||('quantity'in v)||('amount'in v)||('count'in v);
              if(id!=null && (hasQty || (depth>0 && Object.keys(v).length<10))){
                const q=v.qty??v.quantity??v.amount??v.count??defaultQty;
                push(id,q);
                return;
              }
              Object.entries(v).forEach(([k,val])=>{
                const lk=String(k).toLowerCase();
                if(/^\d+$/.test(k)){
                  if(typeof val==='number') push(k,val);
                  else if(Array.isArray(val)) push(k,val[0]??defaultQty);
                  else if(val && typeof val==='object') push(k,val.qty??val.quantity??val.amount??val.count??defaultQty);
                } else if(itemKeys.has(lk)) {
                  visit(val,v.quantity??v.qty??v.amount??v.count??defaultQty,depth+1);
                } else if(val && typeof val==='object' && depth<2 && /item|reward|loot|gain|receive|find|found/.test(lk)) {
                  visit(val,defaultQty,depth+1);
                }
              });
            };
            const q=data.quantity??data.qty??data.amount??data.count??1;
            visit(data,q,0);
            const merged=new Map();out.forEach(x=>merged.set(x.id,(merged.get(x.id)||0)+x.qty));return [...merged].map(([id,qty])=>({id,qty}));
          }
          '''
          s, n = re.subn(r'  function normalizeItems\(data\) \{.*?\n  \}\n\n  function cashTotal', normalize_new + '\n  function cashTotal', s, count=1, flags=re.S)
          assert n == 1

          helpers = r'''  function nextLogPageParams(data,currentParams) {
            const next=data?._metadata?.links?.next;
            if(!next)return null;
            try {
              const u=new URL(next,API+'/user/log');
              const params={...currentParams};
              for(const [k,v] of u.searchParams.entries()){
                if(k==='key'||k==='comment')continue;
                params[k]=v;
              }
              return params;
            } catch(_) { return null; }
          }

          '''
          assert 'function nextLogPageParams' not in s
          s = s.replace('  async function fetchHistory(logIds) {', helpers + '  async function fetchHistory(logIds) {', 1)

          fetch_new = r'''  async function fetchHistory(logIds) {
            const found=new Map();
            const diagnostics={rawRows:0,parsedRows:0,matchedRows:0,batches:Math.ceil(logIds.length/MAX_LOG_IDS_PER_REQUEST),logTypes:logIds.length};
            for(let b=0;b<logIds.length;b+=MAX_LOG_IDS_PER_REQUEST){
              if(state.syncCancel)break;
              const ids=logIds.slice(b,b+MAX_LOG_IDS_PER_REQUEST);
              let params={log:ids.join(','),limit:100,to:nowSec()+60};
              let page=0,previousSignature='';
              while(!state.syncCancel){
                page++; state.syncProgress=`Historical scan ${Math.floor(b/MAX_LOG_IDS_PER_REQUEST)+1}/${diagnostics.batches} · page ${page} · ${qty(found.size)} matching rows found`;render();
                const data=await apiGet('/user/log',params);
                const rows=Array.isArray(data.log)?data.log:[];
                diagnostics.rawRows+=rows.length;
                if(!rows.length)break;
                rows.forEach(r=>{
                  const parsed=parseLogEntry(r);
                  if(parsed.length)diagnostics.parsedRows+=parsed.length;
                  parsed.forEach(t=>{found.set(t.id,t);diagnostics.matchedRows++;});
                });
                const nextParams=nextLogPageParams(data,params);
                if(!nextParams)break;
                const signature=JSON.stringify(nextParams);
                if(signature===previousSignature)break;
                previousSignature=signature;params=nextParams;
                await sleep(REQUEST_GAP_MS);
              }
              await sleep(REQUEST_GAP_MS);
            }
            return {transactions:[...found.values()],diagnostics};
          }
          '''
          s, n = re.subn(r'  async function fetchHistory\(logIds\) \{.*?\n  \}\n\n  async function syncAll\(\)', fetch_new + '\n  async function syncAll()', s, count=1, flags=re.S)
          assert n == 1

          old_sync = '''      const fresh=await fetchHistory(types.map(x=>x.id));\n      const merged=new Map(state.transactions.map(x=>[x.id,x])); fresh.forEach(x=>merged.set(x.id,x));\n      state.transactions=[...merged.values()].filter(t=>state.tracked.some(i=>Number(i.id)===Number(t.itemId))).sort((a,b)=>a.timestamp-b.timestamp);\n      save('transactions',state.transactions); state.sync.lastSync=nowSec(); state.sync.firstSyncComplete=!state.syncCancel;save('sync',state.sync);\n      state.syncProgress=state.syncCancel?`Sync stopped. ${qty(fresh.length)} matching rows collected this run.`:`Historical sync complete · ${qty(state.transactions.length)} tracked acquisition/sale rows stored locally across ${qty(types.length)} log types.`;\n'''
          new_sync = '''      const scan=await fetchHistory(types.map(x=>x.id));\n      const fresh=scan.transactions;\n      const merged=new Map(state.transactions.map(x=>[x.id,x])); fresh.forEach(x=>merged.set(x.id,x));\n      state.transactions=[...merged.values()].filter(t=>state.tracked.some(i=>Number(i.id)===Number(t.itemId))).sort((a,b)=>a.timestamp-b.timestamp);\n      save('transactions',state.transactions); state.sync.lastSync=nowSec(); state.sync.firstSyncComplete=!state.syncCancel;state.sync.diagnostics=scan.diagnostics;save('sync',state.sync);\n      if(state.syncCancel) state.syncProgress=`Sync stopped · ${qty(scan.diagnostics.rawRows)} logs scanned · ${qty(fresh.length)} matching rows collected.`;\n      else if(!fresh.length) state.syncProgress=`Sync finished but found no matching tracked-item rows after scanning ${qty(scan.diagnostics.rawRows)} logs across ${qty(types.length)} candidate log types. Check that your User → Log API key is not restricted to only selected log types/categories.`;\n      else state.syncProgress=`Historical sync complete · ${qty(state.transactions.length)} tracked rows stored · ${qty(scan.diagnostics.rawRows)} raw logs scanned across ${qty(types.length)} candidate log types.`;\n'''
          assert old_sync in s
          s = s.replace(old_sync, new_sync, 1)

          old_local = '<label>Local data</label><div class="tta-banner">${qty(state.transactions.length)} normalized transaction entries · ${qty(state.catalog.length)} Torn items cached. Raw Torn logs are not retained.</div>'
          new_local = '<label>Local data</label><div class="tta-banner">${qty(state.transactions.length)} normalized transaction entries · ${qty(state.catalog.length)} Torn items cached. Raw Torn logs are not retained.${state.sync.diagnostics?`<br>Last scan: ${qty(state.sync.diagnostics.rawRows||0)} raw logs · ${qty(state.sync.diagnostics.logTypes||0)} candidate log types.`:\'\'}</div>'
          assert old_local in s
          s = s.replace(old_local, new_local, 1)

          p.write_text(s)
          PY
          node --check torn-trade-analyzer.user.js
          grep -q '@version      0.1.4' torn-trade-analyzer.user.js
          grep -q 'function nextLogPageParams' torn-trade-analyzer.user.js
          grep -q 'previousScroll' torn-trade-analyzer.user.js
          grep -q 'visit(data,q,0)' torn-trade-analyzer.user.js
          grep -q 'Last scan:' torn-trade-analyzer.user.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add torn-trade-analyzer.user.js
          git commit -m 'Fix accordion scroll and broaden Torn log parsing'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
