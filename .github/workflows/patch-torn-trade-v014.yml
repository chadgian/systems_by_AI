name: Verify Torn Trade Analyzer v0.1.4 patch

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.title == 'Apply Torn Trade Analyzer v0.1.4 verified'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Execute deterministic patch
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('.github/workflows/apply-torn-trade-v014.yml').read_text().splitlines()
          start=next(i for i,line in enumerate(src) if line.strip()=='run: |')+1
          body=[]
          for line in src[start:]:
              body.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(body).replace('${{ github.event.pull_request.head.ref }}','${HEAD_BRANCH}')+'\n'
          Path('/tmp/apply-v014.sh').write_text(script)
          PY
          bash /tmp/apply-v014.sh
